<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Error</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card border-danger shadow">
        <div class="card-header bg-danger text-white">
            <h4 class="mb-0">Operation Failed</h4>
        </div>
        <div class="card-body">
            <p>The server encountered an error processing your request.</p>

            <div th:if="${errorMessage}" class="alert alert-warning">
                <strong>Reason:</strong> <span th:text="${errorMessage}"></span>
            </div>

            <div th:unless="${errorMessage}" class="alert alert-warning">
                Possible causes: File too large, invalid format, or system error.
            </div>

            <a th:href="@{/employees}" class="btn btn-primary">Back to Employees</a>
        </div>
    </div>
</div>
</body>
</html>
