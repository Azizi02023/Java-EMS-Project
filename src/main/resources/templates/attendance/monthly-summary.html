<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Monthly Attendance Summary</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Monthly Attendance Summary</h2>
        <a th:href="@{/employees}" class="btn btn-secondary">Back to Employees</a>
    </div>

    <div class="card bg-light mb-4">
        <div class="card-body">
            <form th:action="@{/attendance/summary}" method="get" class="row g-3 align-items-center">
                <div class="col-auto">
                    <label class="col-form-label fw-bold">Select Period:</label>
                </div>
                <div class="col-auto">
                    <select name="month" class="form-select">
                        <option th:each="i : ${#numbers.sequence(1, 12)}"
                                th:value="${i}"
                                th:text="${i}"
                                th:selected="${i == selectedMonth}"></option>
                    </select>
                </div>
                <div class="col-auto">
                    <input type="number" name="year" class="form-control"
                           th:value="${selectedYear}" min="2000" max="2100">
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-primary">View Report</button>
                </div>
            </form>
        </div>
    </div>

    <table class="table table-bordered table-hover shadow-sm">
        <thead class="table-dark">
        <tr>
            <th>Employee</th>
            <th class="text-center bg-success text-white">Present</th>
            <th class="text-center bg-danger text-white">Absent</th>
            <th class="text-center bg-warning text-dark">Leave</th>
            <th class="text-center bg-info text-white">Late</th>
            <th class="text-center bg-secondary text-white">Half Day</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="stat : ${summaryList}">
            <td>
                <span class="fw-bold" th:text="${stat.firstName} + ' ' + ${stat.lastName}"></span>
                <br>
                <small class="text-muted" th:text="'ID: ' + ${stat.employeeId}"></small>
            </td>
            <td class="text-center fw-bold text-success" th:text="${stat.presentCount}">0</td>
            <td class="text-center fw-bold text-danger" th:text="${stat.absentCount}">0</td>
            <td class="text-center fw-bold text-warning" th:text="${stat.leaveCount}">0</td>
            <td class="text-center" th:text="${stat.lateCount}">0</td>
            <td class="text-center" th:text="${stat.halfDayCount}">0</td>
        </tr>
        <tr th:if="${#lists.isEmpty(summaryList)}">
            <td colspan="6" class="text-center text-muted">No records found for this period.</td>
        </tr>
        </tbody>
    </table>

</div>
</body>
</html>
