<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Bulk Attendance | EMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container my-5">
    <div class="card shadow border-0">
        <div class="card-header bg-dark text-white">
            <h3 class="mb-0 p-2">Bulk Attendance Marking</h3>
        </div>
        <div class="card-body p-4">
            <form th:action="@{/attendance/save-bulk}" th:object="${bulkDTO}" method="POST">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf != null}"/>

                <table class="table">
                    <thead>
                    <tr>
                        <th>Employee</th>
                        <th>Date</th>
                        <th>Status</th>
                        <th>Remarks</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="item, stat : *{attendanceList}">
                        <td>
                            <input type="hidden" th:field="*{attendanceList[__${stat.index}__].employee.id}" />
                            <span th:text="*{attendanceList[__${stat.index}__].employee.firstName} + ' ' + *{attendanceList[__${stat.index}__].employee.lastName}"></span>
                        </td>
                        <td>
                            <input type="date" class="form-control"
                                   th:field="*{attendanceList[__${stat.index}__].date}" required />


                        </td>
                        <td>
                            <select class="form-select" th:field="*{attendanceList[__${stat.index}__].status}">
                                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option>
                            </select>
                        </td>
                        <td>
                            <input type="text" class="form-control"
                                   th:field="*{attendanceList[__${stat.index}__].remarks}" />
                        </td>
                    </tr>
                    </tbody>
                </table>
                <button type="submit" class="btn btn-primary">Save All Records</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
