<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mark Attendance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container my-4">
    <h2>Mark Attendance</h2>
    <h4 class="text-secondary" th:text="'Employee: ' + ${employee.firstName} + ' ' + ${employee.lastName}"></h4>
    <hr>

    <form th:action="@{/attendance/save}" th:object="${attendance}" method="POST">

        <input type="hidden" name="employeeId" th:value="${employee.id}" />

        <div class="mb-3">
            <label class="form-label">Date</label>
            <input type="date" th:field="*{date}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Status</label>
            <select th:field="*{status}" class="form-select">
                <option th:each="stat : ${statuses}"
                        th:value="${stat}"
                        th:text="${stat}"></option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Remarks</label>
            <textarea th:field="*{remarks}" class="form-control" rows="3" placeholder="Optional remarks"></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Save Attendance</button>
        <a th:href="@{/employees}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
