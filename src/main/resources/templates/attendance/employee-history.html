<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Attendance History | EMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container my-5">
    <div class="card shadow-sm border-0">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="mb-0">Attendance History</h2>
                    <p class="text-muted mb-0" th:text="'Employee: ' + ${employee.firstName} + ' ' + ${employee.lastName}"></p>
                </div>
                <div>
                    <a th:href="@{/attendance/mark-bulk}" class="btn btn-outline-primary me-2">Bulk Entry</a>
                    <a th:href="@{/employees}" class="btn btn-secondary">Back to List</a>
                </div>
            </div>

            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                <span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="table-responsive">
                <table class="table table-hover border">
                    <thead class="table-dark">
                    <tr>
                        <th>Date</th>
                        <th>Status</th>
                        <th>Remarks</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="att : ${attendanceList}">
                        <td th:text="${#temporals.format(att.date, 'dd-MMM-yyyy')}"></td>
                        <td>
                            <span th:text="${att.status}"
                                  th:class="${att.status.name() == 'PRESENT'} ? 'badge bg-success' :
                                            (${att.status.name() == 'ABSENT'} ? 'badge bg-danger' : 'badge bg-warning')">
                            </span>
                        </td>
                        <td th:text="${#strings.isEmpty(att.remarks) ? '-' : att.remarks}"></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(attendanceList)}">
                        <td colspan="3" class="text-center py-4 text-muted">No attendance records found for this employee.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
