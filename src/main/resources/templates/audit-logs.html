<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Audit Logs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>System Audit Logs</h2>
        <a th:href="@{/employees}" class="btn btn-secondary">Back to Employees</a>
    </div>

    <table class="table table-hover table-bordered table-striped">
        <thead class="table-dark">
        <tr>
            <th>Timestamp</th>
            <th>Action</th>
            <th>User</th>
            <th>Details</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="log : ${logs}">
            <td th:text="${#temporals.format(log.timestamp, 'yyyy-MM-dd HH:mm:ss')}"></td>
            <td>
                <span th:text="${log.action}"
                      th:class="${log.action == 'EMPLOYEE_CREATED'} ? 'badge bg-success' :
                                (${log.action == 'EMPLOYEE_UPDATED'} ? 'badge bg-warning text-dark' :
                                (${log.action == 'EMPLOYEE_DELETED'} ? 'badge bg-danger' : 'badge bg-info'))">
                </span>
            </td>
            <td th:text="${log.username}"></td>
            <td><small th:text="${log.details}"></small></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
